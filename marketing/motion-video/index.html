<style>
  html,body{margin:0;padding:0;background:#020617;overflow:hidden}

  canvas{position:absolute;inset:0}
  .layer{position:absolute;left:0;right:0;opacity:0;will-change:transform,opacity}
  .center{text-align:center}

  .grad{background:linear-gradient(90deg,#38bdf8,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:104px;line-height:1.05;font-weight:800;margin:34px 60px 0;letter-spacing:-2px}
  .num{font-size:44px;font-weight:700;color:#38bdf8;letter-spacing:4px}
  .num span{color:#475569}
  .ftitle{font-size:88px;font-weight:800;letter-spacing:-2px;margin:18px 70px 0;line-height:1.05}
  .fdesc{font-size:42px;line-height:1.35;color:#cbd5e1;margin:28px 110px 0;font-weight:400}

  .chip{padding:12px 26px;border-radius:999px;background:rgba(30,41,59,.7);border:2px solid rgba(56,189,248,.35);color:#e2e8f0;font-size:32px;font-weight:600}
  #progress{position:absolute;left:140px;right:140px;top:1790px;display:flex;gap:14px;opacity:0}
  #progress div{flex:1;height:8px;border-radius:8px;background:rgba(148,163,184,.25);overflow:hidden}
  #progress div i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0ea5e9,#67e8f9)}
  .benefit{display:flex;align-items:center;gap:26px;margin:0 90px 22px;padding:26px 34px;border-radius:28px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);font-size:40px;font-weight:600;color:#e2e8f0}
  .check{flex:none;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#38bdf8,#06b6d4);display:flex;align-items:center;justify-content:center}

// ---------- feature objects ----------
function makeBolt() {
  const g = new THREE.Group();
  const s = new THREE.Shape();

  [[-.75, mSlate, .8], [0, mSky, 1.05], [.75, mSlate, .8]].forEach(([x, m, s], i) => {
    const f = new THREE.Group();
    const head = new THREE.Mesh(new THREE.SphereGeometry(.26, 32, 16), m); head.position.y = .55; f.add(head);
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(.32, .35, 8, 24), m); body.position.y = -.15; body.scale.z = .7; f.add(body);
    f.position.set(x, -.2, i === 1 ? .2 : -.15); f.scale.setScalar(s); g.add(f); figs.push(f);
  });
  // floating hearts/stars ring
  const stars = []; const sh = new THREE.Shape();
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 + Math.PI / 2, r = i % 2 ? .07 : .16; i ? sh.lineTo(Math.cos(a) * r, Math.sin(a) * r) : sh.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
  const sg = new THREE.ExtrudeGeometry(sh, { depth: .05, bevelEnabled: true, bevelSize: .015, bevelThickness: .015, bevelSegments: 2 }); sg.center();
  for (let i = 0; i < 5; i++) { const s = new THREE.Mesh(sg, new THREE.MeshPhysicalMaterial({ color: 0xfacc15, emissive: 0xf59e0b, emissiveIntensity: .5, metalness: .4, roughness: .3 })); s.position.set((i - 2) * .42, 1.0, .3); g.add(s); stars.push(s); }
  g.userData.update = (lt) => {
    figs.forEach((f, i) => f.position.y = -.2 + Math.abs(Math.sin(lt * 4 + i * 1.1)) * .08);
    stars.forEach((s, i) => { const p = eOutBack(prog(lt, .3 + i * .09, .4)); s.scale.setScalar(p); s.rotation.y = lt * 3 + i; });
    g.rotation.y = Math.sin(lt * 1.2) * .3;
  };
  return g;
}
function makeClock() {
  const g = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1, .1, 24, 96), mSky); g.add(ring);
  const face = new THREE.Mesh(new THREE.CylinderGeometry(.95, .95, .06, 64), mGlass); face.rotation.x = Math.PI / 2; face.position.z = -.04; g.add(face);
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; const tk = new THREE.Mesh(new THREE.BoxGeometry(i % 3 ? .04 : .07, i % 3 ? .12 : .2, .04), i % 3 ? mWhite : mGlow); tk.position.set(Math.sin(a) * .78, Math.cos(a) * .78, .03); tk.rotation.z = -a; g.add(tk); }
  const hh = new THREE.Group(), mh = new THREE.Group();
  const hm = new THREE.Mesh(new RoundedBoxGeometry(.08, .45, .05, 2, .02), mWhite); hm.position.y = .2; hh.add(hm);
  const mm = new THREE.Mesh(new RoundedBoxGeometry(.06, .68, .05, 2, .02), mGlow); mm.position.y = .32; mh.add(mm);
  hh.position.z = .06; mh.position.z = .09; g.add(hh, mh);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(.07, .07, .1, 24), mCyan); hub.rotation.x = Math.PI / 2; hub.position.z = .1; g.add(hub);
  // orbiting arc (speed)
  const arc = new THREE.Mesh(new THREE.TorusGeometry(1.25, .02, 8, 64, Math.PI * .7), mGlow); g.add(arc);
  g.userData.update = (lt) => {
    const sp = lt * 9 * (1 - prog(lt, .4, 1.4) * .85);
    mh.rotation.z = -sp * 1.5; hh.rotation.z = -sp * .2;
    arc.rotation.z = -lt * 5; g.rotation.y = Math.sin(lt * 1.4) * .35; g.rotation.x = -.05;
  };
  return g;
}
function makeVoice() {
  const g = new THREE.Group();
  const orb = new THREE.Mesh(new THREE.SphereGeometry(.5, 64, 32), new THREE.MeshPhysicalMaterial({ color: SKY, emissive: CYAN5, emissiveIntensity: .7, metalness: .2, roughness: .15, clearcoat: 1 })); g.add(orb);
  // mic icon on orb
  const mic = new THREE.Group();
  const cap = new THREE.Mesh(new THREE.CapsuleGeometry(.09, .16, 6, 16), mWhite); cap.position.y = .06; mic.add(cap);
  const u = new THREE.Mesh(new THREE.TorusGeometry(.15, .022, 8, 24, Math.PI), mWhite); u.rotation.z = Math.PI; u.position.y = .02; mic.add(u);
  const st = new THREE.Mesh(new THREE.CylinderGeometry(.02, .02, .1, 8), mWhite); st.position.y = -.17; mic.add(st);
  mic.position.z = .5; g.add(mic);
  const bars = []; const N = 40;
  for (let i = 0; i < N; i++) { const a = i / N * Math.PI * 2; const b = new THREE.Mesh(new RoundedBoxGeometry(.06, 1, .06, 2, .025), i % 2 ? mSky : mGlow); b.userData.a = a; g.add(b); bars.push(b); }
  const ring2 = new THREE.Mesh(new THREE.TorusGeometry(1.42, .015, 8, 120), mGlow); g.add(ring2);
  g.userData.update = (lt) => {
    bars.forEach((b, i) => { const a = b.userData.a; const h = .12 + .38 * Math.abs(Math.sin(lt * 7 + i * .7) * Math.cos(lt * 3.1 + i * .31)); b.scale.y = h; const r = .78 + h / 2; b.position.set(Math.sin(a) * r, Math.cos(a) * r, 0); b.rotation.z = -a; });
    orb.scale.setScalar(1 + Math.sin(lt * 7) * .03); g.rotation.y = Math.sin(lt * 1.3) * .3; ring2.scale.setScalar(1 + (lt * .6 % 1) * .2); ring2.material.opacity = 1;
  };
  return g;
}

// ---------- timeline ----------
const F0 = 3.9, FD = 1.38;
const features = [
  { title: 'Commande par QR&nbsp;Code', desc: 'Vos clients scannent le QR code de leur table et accèdent au menu digital.', obj: null },
  { title: 'Service Ultra-Rapide', desc: 'Les commandes partent directement en cuisine ou au bar.', obj: makeBolt() },
  { title: 'Sans Application', desc: 'Aucune app à installer&nbsp;: tout se passe dans le navigateur.', obj: makePhone() },
  { title: 'Augmentez votre CA', desc: 'Servez plus de clients avec la même équipe.', obj: makeChart() },
  { title: 'Expérience Client', desc: 'Une expérience moderne et fluide qui fidélise.', obj: makeUsers() },
  { title: 'Gain de Temps', desc: 'Votre équipe se concentre sur le service, pas sur la prise de commandes.', obj: makeClock() },
  { title: 'Agent Vocal <span class="grad">IA</span>', desc: 'Réservations automatisées, disponible 24/7.', obj: makeVoice(), scale: .78, chips: ['Réservations', '24/7', 'Compte rendu auto'] },
];
// feature 01 shares the QR: it starts during the intro scan
features.forEach((f, i) => { f.start = i === 0 ? 2.45 : F0 + (i - 1) * FD; f.end = i === 0 ? F0 : f.start + FD; if (f.obj) { f.obj.visible = false; scene.add(f.obj); } });
const FEND = features[6].end; // ~12.2
const BEN0 = FEND, BEN1 = 15.9, OUT0 = BEN1, TOTAL = 19.0;

const progress = document.getElementById('progress');
features.forEach(() => { const d = document.createElement('div'); d.appendChild(document.createElement('i')); progress.appendChild(d); });
const benefits = ['Réduction des erreurs de commande', 'Menu digital modifiable en un clic', 'Paiement intégré', 'Statistiques en temps réel', 'Multi-langues & allergènes', 'Intégration caisse & stocks', 'Multi-établissements'];
const benList = document.getElementById('benList');
benefits.forEach(b => { const d = document.createElement('div'); d.className = 'benefit'; d.innerHTML = `<span class="check"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>${b}`; d.style.opacity = 0; benList.appendChild(d); });

const $ = id => document.getElementById(id);
function show(el, o, dy = 0, s = 1) { el.style.opacity = o; el.style.transform = `translateY(${dy}px) scale(${s})`; }
function inOut(t, a, b, fi = .4, fo = .3) { const i = eOutCubic(prog(t, a, fi)), o = eInCubic(prog(t, b - fo, fo)); return { v: i * (1 - o), i, o }; }

let curFeat = -1;
window.setTime = function (t) {
  // camera drift
  const cz = 7.2 + Math.sin(t * .4) * .25;
  camera.position.set(Math.sin(t * .35) * .5, .35 + Math.sin(t * .27) * .15, cz);
  camera.lookAt(0, .3, 0);
  dust.rotation.y = t * .03; dust.position.y = (t * .08) % 2;
  grid.position.z = (t * 1.2) % (40 / 60 * 1);

  updateQR(t);

  // features 3D
  features.forEach((f, i) => {
    if (!f.obj) return;
    const on = t >= f.start - .05 && t <= f.end + .02; f.obj.visible = on; if (!on) return;
    const lt = t - f.start;
    const pin = eOutBack(prog(t, f.start, .5)), pout = eInCubic(prog(t, f.end - .3, .3));
    f.obj.userData.update(lt);
    const s = Math.max(.0001, pin * (1 - pout)) * (f.scale || .9);
    f.obj.scale.setScalar(s);
    f.obj.position.set(pout * -1.2, FOCUS_Y + pout * .6, -pout * 2);
    f.obj.rotation.y += (1 - pin) * -2.4 + pout * 1.5;
  });

  // header logo
  const hv = inOut(t, 3.6, BEN0 + .2, .5, .4); show($('hdr'), hv.v, (1 - hv.i) * -30);

  // intro text
  const iv = inOut(t, .55, 2.45, .6, .35); show($('intro'), iv.v, (1 - iv.i) * 60 - iv.o * 40);
  $('introPill').style.opacity = eOutCubic(prog(t, .45, .5));
  $('introH').style.opacity = eOutCubic(prog(t, .8, .6));

  // feature text
  const fi = features.findIndex(f => t >= f.start && t < f.end);
  if (fi >= 0) {
    const f = features[fi];
    if (fi !== curFeat) {
      curFeat = fi;
      $('fNum').innerHTML = `${String(fi + 1).padStart(2, '0')} <span>/ 0${features.length}</span>`;
      $('fTitle').innerHTML = f.title; $('fDesc').innerHTML = f.desc;
      $('fChips').innerHTML = (f.chips || []).map(c => `<span class="chip">${c}</span>`).join('');
    }
    const v = inOut(t, f.start + .05, f.end, .35, .22);
    show($('feat'), v.v, (1 - v.i) * 50 - v.o * 30);
    $('fDesc').style.opacity = eOutCubic(prog(t, f.start + .18, .35));
    [...$('fChips').children].forEach((c, k) => { const p = eOutBack(prog(t, f.start + .3 + k * .08, .35)); c.style.opacity = clamp(p); c.style.transform = `scale(${.6 + .4 * p})`; c.style.display = 'inline-block'; });
  } else { show($('feat'), 0); curFeat = -1; }
  const pv = inOut(t, 2.5, FEND + .1, .4, .3); progress.style.opacity = pv.v;
  [...progress.children].forEach((d, k) => { const f = features[k]; d.firstChild.style.width = (prog(t, f.start, f.end - f.start) * 100) + '%'; });

  // benefits
  const bv = inOut(t, BEN0 + .1, BEN1, .4, .3); show($('ben'), bv.v, (1 - bv.i) * 40 - bv.o * 40);
  [...benList.children].forEach((d, k) => { const p = eOutCubic(prog(t, BEN0 + .3 + k * .14, .35)); d.style.opacity = p; d.style.transform = `translateX(${(1 - p) * (k % 2 ? 120 : -120)}px)`; });
  const sp = eOutBack(prog(t, BEN0 + 1.45, .45)); $('stats').style.opacity = clamp(sp); $('stats').style.transform = `scale(${.85 + .15 * sp})`;

  // outro
  const ov = inOut(t, OUT0 + .55, TOTAL + 1, .6, .3); show($('outro'), ov.v, (1 - ov.i) * 60);
  const cp = 1 + Math.sin(Math.max(0, t - OUT0 - 1.4) * 5) * .025 * (t > OUT0 + 1.4 ? 1 : 0); $('cta').style.transform = `scale(${cp})`;

  // global fade in/out
  const fadeIn = prog(t, 0, .35), fadeOut = 1 - prog(t, TOTAL - .4, .4);
  $('stage').style.filter = `brightness(${Math.min(fadeIn, fadeOut)})`;

  composer.render();
};
window.TOTAL = TOTAL;
await document.fonts.ready;
window.ready = true;
window.setTime(parseFloat(new URLSearchParams(location.search).get('t') || '0'));
</script>
